    <script>
      window.addEventListener(
        "load",
        function () {
          function onTouchPreventDefault(event) {
            event.preventDefault();
          }
          document.addEventListener("touchmove", onTouchPreventDefault, false);
          document.addEventListener("touchstart", onTouchPreventDefault, false);
        },
        false
      );
    </script>

      html {

        font-weight: normal;
        font-style: normal;
      }

      body {
        /* default opacity of 1, if animation is not supported */
        opacity: 1;

        background: linear-gradient(
          to bottom,
          #0042bc 0%,
          #0048cc 50%,
          #0055f0 100%
        );
        margin: 0;
        padding: 0;

        animation-name: fadeIn;
        animation-iteration-count: 1;
        animation-timing-function: ease-in;
        animation-duration: 0.5s;

        -webkit-touch-callout: none !important; /* prevent callout to copy image, etc when tap to hold */
        -webkit-text-size-adjust: none !important; /* prevent webkit from resizing text to fit */
        -webkit-user-select: none !important; /* prevent copy paste, to allow, change 'none' to 'text' */
      }
    </style>
